# Render Blueprint — ink-finance
#
# NOTE: the live services were created via the Render CLI, not from this file.
# This blueprint mirrors their working configuration for reference and for
# recreating the stack from scratch (Render Dashboard → New → Blueprint).
#
# Key points:
#   - `--include=dev` is mandatory: Render sets NODE_ENV=production during
#     builds, and plain `npm install` would skip @types/* and tsx.
#   - `npx prisma generate` regenerates the Prisma client after install.
#   - We run TypeScript directly with tsx instead of pre-compiling with tsc,
#     which avoids ESM/CJS mismatches with package.json's "type": "module".
#   - Free plan allows web services only (no background_worker), so the bot
#     also runs as a web service and serves /health on $PORT.

services:
  # ── API ────────────────────────────────────────────────────
  - type: web
    name: ink-finance-api
    runtime: node
    region: oregon
    plan: free
    branch: main
    repo: https://github.com/Inkstellar/ink-finance
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npx tsx server/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      # India is the app's only timezone. Render runs UTC by default, which
      # shifts month buckets and date defaults by 5:30.
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false   # Neon connection string — set in the dashboard
      # Auth.js session signing key. Rotating it signs everyone out.
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: 'true'
      # Shared with the bot service: its credential instead of a session cookie.
      - key: SERVICE_TOKEN
        sync: false
      # The SPA reaches the API through the static site's /api rewrite, so it
      # is same-origin. This allow-list only matters for direct cross-origin
      # callers (e.g. the Vite dev server).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BOT_TOKEN
        sync: false
      # Used to build the "Open in app" button on transaction alerts. Optional:
      # without it the alert is sent with no button.
      - key: WEB_URL
        value: https://ink-finance-web.onrender.com
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: BOT_ALLOWED_USERS
        sync: false

  # ── Telegram Bot ───────────────────────────────────────────
  - type: web
    name: ink-finance-bot
    runtime: node
    region: oregon
    plan: free
    branch: main
    repo: https://github.com/Inkstellar/ink-finance
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npx tsx telegram-bot/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      # Required: the bot cannot reach localhost — point it at the API service.
      - key: VITE_API_URL
        value: https://ink-finance-api.onrender.com
      # Must match the api service. The bot has no browser session, so it
      # authenticates to the API with this shared secret.
      - key: SERVICE_TOKEN
        sync: false
      - key: BOT_ALLOWED_USERS
        sync: false

  # ── Frontend (static site — always free, no plan field) ────
  - type: web
    name: ink-finance-web
    runtime: static
    branch: main
    repo: https://github.com/Inkstellar/ink-finance
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    # Route order is significant: rules are applied top-down.
    #
    # /api/* is proxied to the API service so the browser only ever talks to
    # the origin that served the page. That is what keeps the Auth.js session
    # cookie first-party — onrender.com is on the Public Suffix List, so
    # calling the API directly would be a cross-site, third-party cookie that
    # Safari silently drops. It also removes the need for CORS.
    #
    # Equivalent to:
    #   curl -X PUT https://api.render.com/v1/services/<id>/routes \
    #     -d '[{"type":"rewrite","source":"/api/*","destination":"https://ink-finance-api.onrender.com/api/*"},
    #          {"type":"rewrite","source":"/*","destination":"/index.html"}]'
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ink-finance-api.onrender.com/api/*
      # SPA fallback so deep links (/transactions, /users, …) don't 404.
      - type: rewrite
        source: /*
        destination: /index.html

    # No envVars: VITE_* vars are inlined at build time, and the SPA ships with
    # no API host at all — it calls a relative /api, which the /api rewrite
    # above turns into a same-origin (first-party cookie) request.
