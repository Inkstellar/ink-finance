<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink Finance</title>
    <meta
      name="description"
      content="Personal finance manager — home finances, investments, and loans tracking."
    />

    <!--
      Installable web app. The manifest and the icon set live in public/ and are
      generated by `npm run icons`; the service worker is public/sw.js and is
      registered from src/lib/pwa.ts, in production builds only.
    -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Android tints the status bar with this once installed. -->
    <meta name="theme-color" content="#1a237e" />
    <meta name="color-scheme" content="light" />

    <!--
      iOS. `apple-mobile-web-app-capable` is the spelling iOS actually reads
      (the non-apple one is the standard); `default` keeps the status bar text
      dark, which is what stays legible above the white mobile app bar.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ink Finance" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Ink Finance" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
